<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi CRUD Data Siswa</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Mengunci tinggi halaman agar pas di layar (No Page Scrolling) */
    html, body {
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Mengunci scrollbar halaman utama */
      background-color: #f8f9fa;
    }

    /* Layout Utama menggunakan Flexbox */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 1.25rem 1.5rem 0.75rem 1.5rem;
      box-sizing: border-box;
    }

    /* Konten Baris Utama */
    .content-row {
      flex: 1;
      min-height: 0; /* Penting agar child flex-item bisa memiliki scrollbar */
    }

    /* Membuat Card Tabel memenuhi sisa ruang secara fleksibel */
    .table-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Area khusus Tabel yang memiliki SCROLLBAR */
    .table-scrollable {
      flex: 1;
      overflow-y: auto; /* Scroll hanya di dalam tabel */
    }

    /* Sticky Header agar Judul Kolom Tabel tidak ikut ter-scroll */
    .table-scrollable thead th {
      position: sticky;
      top: 0;
      background-color: #212529;
      color: white;
      z-index: 1;
    }

    /* Style khusus Footer Pengembang */
    footer {
      font-size: 0.85rem;
      border-top: 1px solid #dee2e6;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Judul Header -->
    <h3 class="mb-3 text-center fw-bold text-dark">Sistem Manajemen Data Siswa</h3>

    <!-- Baris Konten Utama -->
    <div class="row content-row g-3">
      
      <!-- Column 1: Form Input (Fixed) -->
      <div class="col-md-4 h-100">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-primary text-white py-2">
            <h6 class="card-title mb-0" id="formTitle">Tambah Data Siswa</h6>
          </div>
          <div class="card-body overflow-auto">
            <form id="studentForm">
              <input type="hidden" id="studentId">
              
              <div class="mb-2">
                <label for="nisn" class="form-label mb-1">NISN</label>
                <input type="number" class="form-control form-control-sm" id="nisn" required placeholder="Masukkan NISN">
              </div>
              
              <div class="mb-2">
                <label for="nama" class="form-label mb-1">Nama Lengkap</label>
                <input type="text" class="form-control form-control-sm" id="nama" required placeholder="Masukkan Nama">
              </div>
              
              <div class="mb-2">
                <label for="kelas" class="form-label mb-1">Kelas</label>
                <input type="text" class="form-control form-control-sm" id="kelas" required placeholder="Contoh: XI PPLG 2">
              </div>

              <div class="mb-3">
                <label for="jurusan" class="form-label mb-1">Jurusan</label>
                <input type="text" class="form-control form-control-sm" id="jurusan" required placeholder="Contoh: AT / MPLB / TO / PPLG / PM">
              </div>

              <button type="submit" class="btn btn-success btn-sm w-100" id="btnSubmit">Simpan Data</button>
              <button type="button" class="btn btn-secondary btn-sm w-100 mt-2 d-none" id="btnCancel" onclick="resetForm()">Batal Edit</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Column 2: Tabel Data Siswa (Scrollable Area) -->
      <div class="col-md-8 h-100">
        <div class="card shadow-sm table-card">
          <div class="card-header bg-dark text-white py-2">
            <h6 class="card-title mb-0">Daftar Siswa</h6>
          </div>
          
          <!-- Wrapper tempat Scrollbar Tabel muncul jika data banyak -->
          <div class="table-scrollable">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>NISN</th>
                  <th>Nama</th>
                  <th>Kelas</th>
                  <th>Jurusan</th>
                  <th style="width: 130px;">Aksi</th>
                </tr>
              </thead>
              <tbody id="studentTableBody">
                <tr>
                  <td colspan="5" class="text-center">Memuat data...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <!-- Footer Nama Pengembang -->
    <footer class="mt-2 py-2 text-center text-muted">
      <small>Dikembangkan oleh: <strong>zaina aulia</strong></small>
    </footer>
  </div>

  <script>
    // GANTI SCRIPT_URL DI BAWAH INI DENGAN WEB APP URL GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyK1Du1pjiyUkrmEl1StVNAEmf2KAS2aH75stGhMRD_J2z9DosZtiXnUJLKpEiRD5ygnw/exec";

    document.addEventListener("DOMContentLoaded", loadStudents);

    // 1. READ: Mengambil Data Siswa dari Google Sheets
    function loadStudents() {
      fetch(`${SCRIPT_URL}?action=read`)
        .then(res => res.json())
        .then(result => {
          const tbody = document.getElementById("studentTableBody");
          tbody.innerHTML = "";

          if (result.status === "success" && result.data.length > 0) {
            result.data.forEach(siswa => {
              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td>${siswa.nisn}</td>
                <td>${siswa.nama}</td>
                <td>${siswa.kelas}</td>
                <td>${siswa.jurusan}</td>
                <td>
                  <button class="btn btn-sm btn-warning py-0 px-2" onclick="editStudent('${siswa.id}', '${siswa.nisn}', '${siswa.nama}', '${siswa.kelas}', '${siswa.jurusan}')">Edit</button>
                  <button class="btn btn-sm btn-danger py-0 px-2" onclick="deleteStudent('${siswa.id}')">Hapus</button>
                </td>
              `;
              tbody.appendChild(tr);
            });
          } else {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center">Belum ada data siswa.</td></tr>`;
          }
        })
        .catch(err => {
          console.error("Error loading data:", err);
          document.getElementById("studentTableBody").innerHTML = `<tr><td colspan="5" class="text-center text-danger">Gagal memuat data. Periksa URL API.</td></tr>`;
        });
    }

    // 2. CREATE & UPDATE: Menyimpan atau Mengubah Data
    document.getElementById("studentForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const id = document.getElementById("studentId").value;
      const nisn = document.getElementById("nisn").value;
      const nama = document.getElementById("nama").value;
      const kelas = document.getElementById("kelas").value;
      const jurusan = document.getElementById("jurusan").value;

      const action = id ? "update" : "create";
      const payload = { action, id, nisn, nama, kelas, jurusan };

      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.disabled = true;
      btnSubmit.innerText = "Menyimpan...";

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(result => {
        alert(result.message);
        resetForm();
        loadStudents();
      })
      .catch(err => alert("Terjadi kesalahan saat menyimpan data."))
      .finally(() => {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Simpan Data";
      });
    });

    // Menyiapkan Form untuk mode EDIT
    function editStudent(id, nisn, nama, kelas, jurusan) {
      document.getElementById("studentId").value = id;
      document.getElementById("nisn").value = nisn;
      document.getElementById("nama").value = nama;
      document.getElementById("kelas").value = kelas;
      document.getElementById("jurusan").value = jurusan;

      document.getElementById("formTitle").innerText = "Edit Data Siswa";
      document.getElementById("btnSubmit").innerText = "Perbarui Data";
      document.getElementById("btnCancel").classList.remove("d-none");
    }

    // Reset Form ke Mode SIMPAN/BARU
    function resetForm() {
      document.getElementById("studentId").value = "";
      document.getElementById("studentForm").reset();
      document.getElementById("formTitle").innerText = "Tambah Data Siswa";
      document.getElementById("btnSubmit").innerText = "Simpan Data";
      document.getElementById("btnCancel").classList.add("d-none");
    }

    // 3. DELETE: Menghapus Data Siswa
    function deleteStudent(id) {
      if (confirm("Apakah Anda yakin ingin menghapus data siswa ini?")) {
        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete", id: id })
        })
        .then(res => res.json())
        .then(result => {
          alert(result.message);
          loadStudents();
        })
        .catch(err => alert("Gagal menghapus data."));
      }
    }
  </script>

</body>
</html>
